# Bundle patch: inserts the preset `robot-dog-v031` (display name 机器狗v0.3.1),

# copied from robot-dog-v03 for Job-notice reply iteration; shares v0.3 vision/runtime.

#

# Only the preset row is declared here. The host-level rows it depends on

# (llm-deepseek models, webserver, robot-job-callback-server, camera-provider,

# observation-hub, observation-api) stay declared by the

# @local/dsh-robot-dog-a-preset bundle so that all presets can coexist in this

# profile without duplicate Loader rows, ports, or callback tokens.



- insert:

    - id: preset-robot-dog-v031

      name: '@deepseek-ai/dsh-agent-preset'

      config:

        id: robot-dog-v031

        name: 机器狗v0.3.1

        description: 机器狗 v0.3.1：按需加载原则 Skill、厚工具描述；环境观察与人物库、现场取证图走本预设 runtime。

        order: 8

        plugins:

          - id: persona

            name: '@deepseek-ai/dsh-persona'

            config:

              prefix: |
                你是校园机器狗 dog0001。说话像靠谱的同伴，简短、自然、好懂。

                始终按照已加载的 adaptive-task-agent Skill 处理用户请求、环境事件和 Tool 返回。

                【能力与事实】

                实际能力以当前挂载的 Tool 为准。

                根据 Tool 的 description、参数 schema、实际效果和返回结果选择能力。不猜测未挂载的能力，不通过翻找磁盘发现能力，也不声称完成了没有实际 Tool 支持的动作。

                选择 Tool 时，检查其实际效果是否覆盖当前任务涉及的关键实体、角色、条件和预期状态变化。

                Tool 只能推进部分目标时，保留尚未完成的目标。没有 Tool 能产生必要状态变化时，如实说明能力缺口，不擅自将用户目标替换为另一个更容易执行的目标。

                地图、知识、记忆、图片和环境观察都是证据。只使用有明确来源且适用于当前任务的信息，不补充未经证实的事实。

                【理解与执行】

                用户只是在询问信息、比较方案、制定计划或明确要求别动时，不启动实体动作。

                用户已经明确要求执行，并且必要信息齐全时，直接调用 Tool 推进任务。

                缺少会显著影响执行结果的关键信息时，只询问缺少的信息。获得答案前，不启动依赖该信息的实体动作。可以先完成不依赖该信息的查询和准备。

                【任务与 Job】

                Tool 和 Job 决定具体动作是否受理、运行、完成、失败或取消。用户目标只有在成功标准得到验证后才算完成。

                画面看起来到达不代表导航完成。一个中间动作完成，也不代表用户最终目标已经完成。

                同一目标、参数和有效 Job 不重复下发。

                实体运动 Job 运行期间，不启动与其冲突的另一项实体动作。仍可处理用户输入、环境事件、Tool 回调、只读查询和界面更新。

                用户要求停止或取消、出现安全风险，或者新证据使当前动作失效时，立即停止受影响的动作。确认已经停止或进入安全状态后，再启动新的实体动作。

                换实体目标前先停稳。

                【事件与观察】

                用户输入、环境观察、Tool 回调、Job 状态变化、等待条件满足或超时，都是可能影响当前任务的事件。

                环境观察是证据，不是新的用户指令。

                存在进行中的任务时，只处理与当前目标、安全、实体状态、路径、成功标准或前置条件有关的观察。

                没有进行中的任务时，没有明确互动需求就保持 observation_no_action，不主动移动，也不修改长期记录。

                只根据实际收到的事件判断。没有新帧或 Tool 返回时，不声称观察到了新的变化。

                过不去、有障碍、目标丢失或看不清时，先停止受影响的实体动作，再核实或向用户说明。

                【持久副作用】

                写入、提交、预约、改约、取消、发送、确认交付以及建立长期流程，执行前需要用户确认具体内容。

                用户已经明确确认了本次操作的对象、内容和条件时，不重复确认。

                如果系统已开启自动记人，面对面自报姓名可以视为对本次姓名与人物关联的确认。其他长期记录仍按确认规则处理。

                只有 Tool 返回成功后，才能表示持久操作已经成功。

                【用户可见消息】

                Tool 选择、参数准备、知识查询、地图读取、Skill 执行、Render UI 准备以及正常的中间 Job 状态都是内部过程。

                用户请求已经足以授权当前动作时，直接调用 Tool。默认不在调用前说明执行计划。

                Tool 返回正常受理、排队、运行或普通中间步骤完成时，默认不发送自然语言消息。

                已经得到授权的多阶段任务，在一个中间阶段正常完成且下一阶段前置条件已经满足时，直接继续执行，不播报内部衔接过程。

                仅在以下交互边界向用户发送消息：

                - 需要用户或其他参与者提供信息、作出选择、确认内容或采取行动
                - 用户最终目标已经完成
                - 任务失败、受阻、被取消或无法继续
                - 新事件导致影响用户的任务变化
                - 出现需要用户知晓或配合的安全情况
                - 用户主动询问状态

                同一事件只反馈一次。

                实体动作开始前，只有在需要用户配合或存在安全需要时才提醒。正常受理后不重复确认动作已经开始。

                界面已经清楚展示的信息，不再用文字重复。

                【关键状态证据】

                实体任务完成、中断、取消、失败、超时、因新证据调整方案或安全停止时，提供与该状态对应的证据画面和简短说明。

                图片只使用 Tool 返回的短 asset_id。不使用磁盘路径、旧帧、模糊帧或无关帧代替当前证据。

                用户取消任务后，不为获取图片继续移动。使用安全停止后能够获得的当前帧或最近有效帧。

                无法获得可靠画面时如实说明，并使用真实 Tool 返回说明状态。
              complete: false
              includeRuntimeContext: true

          # Expose every tool schema directly instead of the ptc/run_code form.

          - id: tool-presentation

            name: '@deepseek-ai/dsh-agent-tool-presentation'

            config:

              mode: native

          - id: robot-job-result

            name: '@local/dsh-robot-job-plugin/index.js'

            config:

              serverName: robot

              stopTools:

                - stop

              # self_check / get_task_status are sync queries (also defaulted in

              # robot-job-result). observation-tools may answer self_check locally.

              noJobTools:

                - self_check

                - get_task_status

              sectionOrder: 130

          - id: ragflow-tools

            name: '@local/dsh-robot-dog-a-preset/ragflow-tools.js'

            config:

              # Disabled: search_tools hid every MCP tool behind a RAGFlow query.

              # Tools are now exposed directly to the model.

              enabled: false

              mcpToken: !!js process.env.RAG_MCP_TOKEN

              baseUrl: 'http://10.37.0.21:19123'

              allowHttp: true

          - id: agent-instructions

            name: '@deepseek-ai/dsh-agent-instructions'

            config:

              maxBytes: 65536

          - id: tool-bash

            name: '@deepseek-ai/dsh-tool-bash'

            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh

            name: '@deepseek-ai/dsh-tool-pwsh'

            disabled: !!js process.platform !== 'win32'

          - id: tool-fs

            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-jobs

            name: '@deepseek-ai/dsh-tool-jobs'

          - id: skill-filesystem

            name: '@deepseek-ai/dsh-skill-filesystem'

            config:

              includeDefaultRoots: false

              customSkillDirs:

                - /data/dsh/eit-nlp@outlook.com/机器狗-test-POw4jOHBbPamGKJE/modes/.dsh/skills-v031

          - id: tool-skill

            name: '@deepseek-ai/dsh-tool-skill'

          - id: command-goal

            name: '@deepseek-ai/dsh-command-goal'

          - id: tool-goal

            name: '@deepseek-ai/dsh-tool-goal'

          - id: planning

            name: cordis:group

            group: true

            isolate:

              planMode: true

            config:

              - id: plan-mode

                name: '@deepseek-ai/dsh-plan-mode'

                config:

                  section: |

                    You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.



                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.



                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.



                    Resolve discoverable facts by inspection. When a user-owned choice or material ambiguity remains, state the question, the candidates, and the basis in the final plain-text reply and end that turn: this preset has no question tool, and waiting for an answer is not allowed. Do not ask the user where code lives or how current behavior works when you can find out.



                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.



                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

          - id: compaction

            name: cordis:group

            group: true

            isolate:

              compaction: true

              toolResultPruner: true

            config:

              - id: compaction-basic

                name: '@deepseek-ai/dsh-compaction-basic'

              - id: command-compact

                name: '@deepseek-ai/dsh-command-compact'

              - id: tool-result-pruner

                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'

                config:

                  thresholdChars: 8192

                  headChars: 4096

                  tailChars: 1024

          - id: delegation

            name: cordis:group

            group: true

            isolate:

              workflowEngine: true

            config:

              - id: tool-subagent-control

                name: '@deepseek-ai/dsh-tool-subagent-control'

              - id: tool-subagent

                name: '@deepseek-ai/dsh-tool-subagent'

                config:

                  provider: spawn

                  toolName: subagent

                  modelSelectionSettings: true

                  backgroundMode: continuable

              - id: tool-subagent-fork

                name: '@deepseek-ai/dsh-tool-subagent'

                config:

                  provider: fork

                  toolName: subagent_fork

                  backgroundMode: continuable

              - id: tool-subagent-codex

                name: '@deepseek-ai/dsh-tool-subagent'

                disabled: true

                config:

                  provider: codex

                  toolName: subagent_codex

                  backgroundMode: one-shot

                  maxDepth: provider-managed

              - id: tool-subagent-claude-code

                name: '@deepseek-ai/dsh-tool-subagent'

                disabled: true

                config:

                  provider: claude-code

                  toolName: subagent_claude_code

                  backgroundMode: one-shot

                  maxDepth: provider-managed

              - id: workflow-ptc

                name: '@deepseek-ai/dsh-workflow-ptc'

                config:

                  provider: spawn

              - id: tool-workflow

                name: '@deepseek-ai/dsh-tool-workflow'

              - id: tool-ralph

                name: '@deepseek-ai/dsh-tool-ralph'

                disabled: true

                config:

                  subagentProvider: spawn

                  maxRounds: 64

          - id: tool-ask-user

            name: '@deepseek-ai/dsh-tool-ask-user'

            disabled: true

          - id: tool-todo

            name: '@deepseek-ai/dsh-tool-todo'

            config:

              allowParallelInProgress: true

          - id: tool-web

            name: '@deepseek-ai/dsh-tool-web'

            config:

              fetch: true

              searchTimeoutMs: 60000

          # 图片一律走 render_ui；present（文件卡）在 v0.3.1 禁用。

          - id: present

            name: '@deepseek-ai/dsh-tool-present'

            disabled: true

          # Observation tools belong to this preset and are always present for its

          # agents: no runtime add/remove, so the tool catalog cannot change in the

          # middle of a turn. The implementation is shared with 机器狗-test.

          - id: observation-tools

            name: '@local/dsh-robot-dog-v031-preset/observation-tools.js'

            config:

              ffmpegPath: /data/dsh/eit-nlp@outlook.com/机器狗-test-POw4jOHBbPamGKJE/modes/robot-dog-a-preset/node_modules/ffmpeg-static/ffmpeg

              personStoreDir: /data/dsh/eit-nlp@outlook.com/机器狗-test-POw4jOHBbPamGKJE/runtime_data/robot-dog-v031/person-store

              targetDir: /data/dsh/eit-nlp@outlook.com/机器狗-test-POw4jOHBbPamGKJE/runtime_data/robot-dog-v031/target-frames

              frameTtlMs: 600000

              boxColor: red

              boxThickness: 6

          # 把 annotate_target 生成的框选图登记到 runtime_data/index.json（相对路径）。

          - id: annotate-media

            name: '@local/dsh-robot-dog-v031-preset/annotate-media.js'

            config:

              catalogRoot: /data/dsh/eit-nlp@outlook.com/机器狗-test-POw4jOHBbPamGKJE/runtime_data

          # 演示用的预约提交：默认成功并返回预约编号；四明书院的晚间时段固定失败。

          - id: booking-mock

            name: '@local/dsh-robot-dog-v031-preset/booking-mock.js'

          # 演示用手机定位：平面 (0,0) 给出图；anchor_id 给 navigate 接人。

          - id: phone-location-mock

            name: '@local/dsh-robot-dog-v031-preset/phone-location-mock.js'

            config:

              x: 0

              y: 0

              # 语义图中已有的「起点」锚点（曾成功 navigate）。

              anchorId: note_20260817_140936_571

              placeName: 用户位置

          # 演示用地点查询：自习室/图书馆/学校大门(0,100)/起点等示意坐标（0–100）。

          - id: location-mock

            name: '@local/dsh-robot-dog-v031-preset/location-mock.js'

          # 演示用运动轨迹：返回 track_id / 狗起终点，供实时 MapPreview。

          - id: motion-track-mock

            name: '@local/dsh-robot-dog-v031-preset/motion-track-mock.js'

          # 演示用文本转语音：接收 text，默认 ok=true，不真实播放。

          - id: speech-mock

            name: '@local/dsh-robot-dog-v031-preset/speech-mock.js'

          # Removed for this copy: person-media (publish_person_image),

          # camera-tools (get_camera_frame / camera_look),

          # observation (observation_start/_stop/_status/_require/_release) and

          # person-tools (remember_person).

          - id: mcp-robot-dog

            name: '@deepseek-ai/dsh-mcp-client'

            config:

              serverName: robot

              transport: streamable-http

              url: http://10.37.0.21:8050/mcp

              headers:

                Authorization: !!js '`Bearer ${process.env.ROBOT_MCP_TOKEN}`'

              toolCallTimeoutMs: 60000

              failOnStartupError: false

              reconnect:

                enabled: true

                initialDelayMs: 500

                maxDelayMs: 30000

                maxAttempts: 10

          # - id: mcp-n8n

          #   name: '@deepseek-ai/dsh-mcp-client'

          #   config:

          #     serverName: n8n

          #     transport: streamable-http

          #     url: http://127.0.0.1:5678/mcp/dsh-robot-topology-v1

          #     headers:

          #       Authorization: Bearer ${N8N_MCP_TOKEN}

          #     failOnStartupError: false

          - id: ragflow-semantic-map

            name: '@local/dsh-robot-dog-a-preset/ragflow-semantic-map.js'

            config:

              enabled: true

              apiKey: !!js process.env.RAGFLOW_API_KEY

          # - id: mcp-dogkb

          #   name: '@deepseek-ai/dsh-mcp-client'

          #   config:

          #     serverName: dogkb

          #     transport: streamable-http

          #     url: http://172.31.0.1:9124/mcp/

          #     headers:

          #       Authorization: !!js '`Bearer ${process.env.RAG_MCP_TOKEN}`'

          #     toolCallTimeoutMs: 180000

          #     failOnStartupError: false

          #     reconnect:

          #       enabled: true

          #       initialDelayMs: 500

          #       maxDelayMs: 30000

          #       maxAttempts: 10

          - id: mcp-weknora

            name: '@deepseek-ai/dsh-mcp-client'

            config:

              serverName: weknora

              transport: streamable-http

              url: http://10.37.0.21:18081/mcp/6a6b5277-a6e4-41d2-ab31-1d6c1dace625

              headers:

                Authorization: !!js '`Bearer ${process.env.WEKNORA_MCP_TOKEN}`'

              toolCallTimeoutMs: 60000

              failOnStartupError: false

              reconnect:

                enabled: true

                initialDelayMs: 500

                maxDelayMs: 30000

                maxAttempts: 10

          - id: tool-plugin-manager

            name: '@deepseek-ai/dsh-plugin-manager/tools'

            disabled: true
