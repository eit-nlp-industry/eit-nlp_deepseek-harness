              enabled: false
              mcpToken: 'hE7zktyr9lFjoKyX4bxCfeHXtCBac_ObNWS_v69LXpI'
              baseUrl: 'http://10.37.0.21:19123'
              allowHttp: true
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
