<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Robot Task Result</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a222c;
      --text: #e7ecf1;
      --muted: #8b9aab;
      --accent: #3d9a6a;
      --accent-hover: #4db87e;
      --border: #2a3542;
      --danger: #d45d5d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "IBM Plex Sans", "Noto Sans SC", system-ui, sans-serif;
      background:
        radial-gradient(ellipse 80% 50% at 20% 0%, #1a2f28 0%, transparent 55%),
        var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main {
      width: min(440px, 100%);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px 24px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    p.hint {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 0.85rem;
      line-height: 1.4;
    }
    label {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 8px;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #12181f;
      color: var(--text);
      font-size: 0.95rem;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      outline: none;
    }
    input:focus { border-color: var(--accent); }
    button {
      margin-top: 16px;
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover:not(:disabled) { background: var(--accent-hover); }
    button:disabled { opacity: 0.55; cursor: wait; }
    pre {
      margin-top: 18px;
      padding: 12px 14px;
      border-radius: 8px;
      background: #12181f;
      border: 1px solid var(--border);
      font-size: 0.75rem;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 280px;
      overflow: auto;
      color: var(--muted);
    }
    pre.ok { color: #9fd6b5; }
    pre.err { color: #efb0b0; }
  </style>
</head>
<body>
  <main>
    <h1>任务完成回调</h1>
    <p class="hint">输入 task_id 后点确认：会调用 post-robot-task-result.sh（默认回调 http://10.37.0.21:13181/robot-task-results），并自动清空输入框。</p>
    <form id="form">
      <label for="taskId">task_id</label>
      <input id="taskId" name="taskId" autocomplete="off" placeholder="sbi_..." required />
      <button type="submit" id="btn">确认</button>
    </form>
    <pre id="log">等待输入…</pre>
  </main>
  <script>
    const form = document.getElementById("form");
    const input = document.getElementById("taskId");
    const btn = document.getElementById("btn");
    const log = document.getElementById("log");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const taskId = input.value.trim();
      if (!taskId) return;

      btn.disabled = true;
      log.className = "";
      log.textContent = "运行中…\n" + taskId;

      // 确认后立刻清空输入框
      input.value = "";

      try {
        const res = await fetch("/api/complete", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ task_id: taskId }),
        });
        const data = await res.json().catch(() => ({}));
        const text = typeof data.output === "string" ? data.output : JSON.stringify(data, null, 2);
        log.className = res.ok ? "ok" : "err";
        log.textContent = (res.ok ? "成功\n" : "失败\n") + text;
      } catch (err) {
        log.className = "err";
        log.textContent = "请求失败: " + (err && err.message ? err.message : String(err));
      } finally {
        btn.disabled = false;
        input.focus();
      }
    });

    input.focus();
  </script>
</body>
</html>
