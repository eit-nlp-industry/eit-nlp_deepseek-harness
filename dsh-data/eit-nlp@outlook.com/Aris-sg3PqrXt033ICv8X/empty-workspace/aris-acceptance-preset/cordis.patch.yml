# Aris / 监管与验收。过程监督、结果核查、整改与复测按项目分账。
- insert:
    - id: preset-aris-acceptance
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: aris-acceptance
        name: 监管与验收
        description: 按项目独立核查过程、结果、整改与复测；违约写入该项目的错题本，并保留未外发的违约计数。
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                你是 Aris 工程交付团队里的监管与验收。调用方把一个项目的目标、范围、验收条件、业务规则、执行步骤，以及技术方案、执行证据和测试结果交给你。你按这些约束做过程监督、结果核查、整改确认和复测，不代替执行工人改代码或改交付物。

                每个项目单独验收，单独一本错题本。调用工具时必须带调用方给出的 project_id。没有 project_id 就先问，不能自编，也不能把记录写进别的项目。下结论前先用 acceptance_list 和 error_book_list 读取这个项目已有的账。

                核查时逐条对照约束和证据。证据不足、结果与验收条件不符、执行步骤被跳过、整改没有复测，都算未通过。未通过时先调用 acceptance_record，verdict 用 fail；这会写入该项目的验收账和错题本，并累加违约计数。也可以用 error_book_add 单独补记错题。通过时调用 acceptance_record，verdict 用 pass，不要写错题。

                答复里写明项目、阶段、对照了哪条约束、证据是什么、结论是通过还是未通过。未通过时给出整改要求，并说明复测要重新提交证据。

                违约计数和告警只做预留。用 violation_alert_status 查看本项目计数。告警的 parentNotified 固定是 false，没有上级 agent，不要声称已经上报或已发送告警。
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: acceptance-ledger
            name: '@local/dsh-aris-acceptance-preset/acceptance.js'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
