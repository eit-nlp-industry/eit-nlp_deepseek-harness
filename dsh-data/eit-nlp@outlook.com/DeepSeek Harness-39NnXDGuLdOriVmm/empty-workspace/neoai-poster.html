<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NeoAI 发布海报 · 让 AI 成为你的第二大脑</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: #05060f;
    font-family: "Noto Sans SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  .stage {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    background:
      radial-gradient(900px 700px at 15% 10%, rgba(124,77,255,.18), transparent 60%),
      radial-gradient(900px 700px at 85% 90%, rgba(46,123,255,.16), transparent 60%),
      #05060f;
  }
  .poster {
    width: min(1080px, 100%);
    aspect-ratio: 1080 / 1440;
    max-height: calc(100vh - 64px);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 40px 120px rgba(89, 61, 255, .28), 0 0 0 1px rgba(138,180,255,.15);
  }
  .poster img { display: block; width: 100%; height: 100%; object-fit: contain; }
  @media print {
    @page { size: 1080px 1440px; margin: 0; }
    .stage { padding: 0; background: none; }
    .poster { max-height: none; border-radius: 0; box-shadow: none; }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="poster">
      <img src="neoai-poster.svg" alt="NeoAI 产品发布海报：让 AI 成为你的第二大脑，2027.01.15 全球发布">
    </div>
  </div>
</body>
</html>
