# Video debug console for this home. The panel title does not use a version label.
- insert:
    - id: vision-console
      name: '@local/dsh-campus-activity-vision-console'
      config:
        videoPath: /data/dsh/eit-nlp@outlook.com/test-cdt-VDe1vpITgGDI6TXV/runtime_data/media/test.mp4
        ffmpegPath: /data/dsh/eit-nlp@outlook.com/test-cdt-VDe1vpITgGDI6TXV/empty-workspace/campus-activity-vision-console/node_modules/ffmpeg-static/ffmpeg
